name: IndexNow

# After each production deployment, tell Bing and the other IndexNow engines
# which public pages changed (scripts/indexnow.mjs). Vercel reports every
# deployment to GitHub; this runs on the ones it marks successful in the
# Production environment, so the pages it reads are the ones just deployed.

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

# One at a time, so two quick deploys do not both read the same old state.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # What each page said last time, so only changed pages are submitted.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - run: node scripts/indexnow.mjs --state .indexnow-state.json

      - uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-${{ github.run_id }}
